<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Voltara — Real-time energy operations for regional substations" />
<title>Voltara Energy Management</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
:root {
  --surface: #0f1117;
  --panel: #1a1d27;
  --ink: #e8ecf1;
  --muted: #6b7280;
  --accent: #3b82f6;
  --alert: #ef4444;
  --amber: #f59e0b;
  --green: #22c55e;
  --radius: 6px;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --shadow: 0 1px 3px rgba(0,0,0,.35), 0 4px 12px rgba(0,0,0,.25);
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  font: 13px/1.6 var(--font);
  background: var(--surface);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Header */
header {
  position: sticky; top: 0; z-index: 20;
  background: var(--surface);
  border-bottom: 1px solid rgba(255,255,255,.06);
  padding: var(--space-3) var(--space-5);
  display: flex; align-items: center; gap: var(--space-4);
}
.brand {
  display: flex; align-items: center; gap: var(--space-3);
  font-weight: 600; font-size: 15px; letter-spacing: -.01em;
}
.brand-mark {
  width: 28px; height: 28px; border-radius: var(--radius);
  background: var(--accent);
  display: grid; place-items: center;
}
.brand-mark svg { width: 16px; height: 16px; stroke: #fff; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
nav[aria-label="Primary"] {
  display: flex; gap: var(--space-1);
  margin-left: auto;
}
.nav-item {
  background: none; border: 0; color: var(--muted);
  padding: var(--space-2) var(--space-3); border-radius: var(--radius);
  font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
  transition: color .12s, background .12s;
}
.nav-item:hover { color: var(--ink); }
.nav-item.active { color: var(--ink); background: rgba(255,255,255,.05); }

/* Layout */
.page {
  display: grid;
  grid-template-columns: 1fr 280px;
  grid-template-rows: auto 1fr;
  gap: var(--space-5);
  padding: var(--space-5);
  max-width: 1400px; margin: 0 auto;
}
@media (max-width: 960px) {
  .page { grid-template-columns: 1fr; }
  aside[role="complementary"] { order: 2; }
}

/* KPI band */
.kpi-band {
  grid-column: 1 / -1;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-4);
}
@media (max-width: 720px) {
  .kpi-band { grid-template-columns: repeat(2, 1fr); }
}
.kpi-tile {
  background: var(--panel);
  border: 1px solid rgba(255,255,255,.06);
  border-radius: var(--radius);
  padding: var(--space-4) var(--space-5);
  display: flex; flex-direction: column; gap: var(--space-2);
}
.kpi-tile[aria-busy="true"] {
  min-height: 88px;
  position: relative; overflow: hidden;
}
.kpi-tile[aria-busy="true"]::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(100deg, transparent 20%, rgba(255,255,255,.03) 50%, transparent 80%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
}
@keyframes shimmer { to { background-position: -200% 0; } }
.kpi-label {
  font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
}
.kpi-value {
  font-size: 28px; font-weight: 600; letter-spacing: -.03em; line-height: 1;
}
.kpi-value.alert { color: var(--alert); }
.kpi-value.amber { color: var(--amber); }

/* Site card grid */
.site-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: var(--space-4);
}
.site-card {
  background: var(--panel);
  border: 1px solid rgba(255,255,255,.06);
  border-radius: var(--radius);
  padding: var(--space-4);
  cursor: pointer;
  transition: border-color .12s, transform .12s;
}
.site-card:hover { border-color: rgba(255,255,255,.12); }
.site-card:active { transform: scale(.99); }
.site-card-header {
  display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-3);
  margin-bottom: var(--space-3);
}
.site-name {
  font-size: 14px; font-weight: 600; letter-spacing: -.01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.site-region {
  font-size: 11px; color: var(--muted); margin-top: 2px;
}
.site-metrics {
  display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3);
  margin-top: var(--space-3);
  padding-top: var(--space-3);
  border-top: 1px solid rgba(255,255,255,.06);
}
.metric { display: flex; flex-direction: column; gap: 2px; }
.metric-value { font-size: 18px; font-weight: 600; letter-spacing: -.02em; }
.metric-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

/* Status pills */
.pill {
  display: inline-flex; align-items: center; gap: var(--space-2);
  padding: 3px 10px; border-radius: 999px;
  font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em;
}
.pill-dot { width: 6px; height: 6px; border-radius: 50%; }
.pill-healthy { background: rgba(34,197,94,.12); color: var(--green); }
.pill-healthy .pill-dot { background: var(--green); }
.pill-warning { background: rgba(245,158,11,.12); color: var(--amber); }
.pill-warning .pill-dot { background: var(--amber); }
.pill-fault { background: rgba(239,68,68,.12); color: var(--alert); }
.pill-fault .pill-dot { background: var(--alert); }

/* Alert feed */
.alert-feed {
  background: var(--panel);
  border: 1px solid rgba(255,255,255,.06);
  border-radius: var(--radius);
  padding: var(--space-4);
}
.alert-feed h2 {
  font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
  color: var(--muted); margin-bottom: var(--space-4);
}
.alert-item {
  display: flex; align-items: flex-start; gap: var(--space-3);
  padding: var(--space-3) 0;
  border-bottom: 1px solid rgba(255,255,255,.04);
}
.alert-item:last-child { border-bottom: 0; }
.alert-severity {
  width: 6px; height: 6px; border-radius: 50%; margin-top: 6px; flex-shrink: 0;
}
.alert-severity.critical { background: var(--alert); }
.alert-severity.warning { background: var(--amber); }
.alert-severity.info { background: var(--accent); }
.alert-text { flex: 1; min-width: 0; }
.alert-message {
  font-size: 12px; line-height: 1.5;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.alert-meta {
  font-size: 11px; color: var(--muted); margin-top: 2px;
}
.alert-item button {
  background: none; border: 0; color: var(--accent);
  font-size: 11px; font-weight: 500; padding: 2px 6px; border-radius: var(--radius);
  white-space: nowrap;
}
.alert-item button:hover { background: rgba(59,130,246,.08); }

/* Empty state */
.empty {
  text-align: center; padding: var(--space-7) var(--space-5);
  display: flex; flex-direction: column; align-items: center; gap: var(--space-4);
}
.empty svg { width: 48px; height: 48px; stroke: var(--muted); stroke-width: 1.5; fill: none; }
.empty-title { font-size: 16px; font-weight: 600; }
.empty-sub { font-size: 13px; color: var(--muted); line-height: 1.5; }
.empty-cta {
  margin-top: var(--space-2);
  background: var(--accent); color: #fff; border: 0;
  padding: var(--space-3) var(--space-5); border-radius: var(--radius);
  font-weight: 500; font-size: 13px;
}
.empty-cta:hover { background: #2563eb; }
.empty-cta:active { transform: scale(.98); }

/* Error state */
.error {
  padding: var(--space-7) var(--space-5); text-align: center;
}
.error-title { color: var(--alert); font-size: 16px; font-weight: 600; }
.error-sub { color: var(--muted); font-size: 13px; margin-top: var(--space-2); }
.error-retry {
  margin-top: var(--space-4);
  background: none; border: 1px solid rgba(255,255,255,.12); color: var(--ink);
  padding: var(--space-2) var(--space-4); border-radius: var(--radius);
}
.error-retry:hover { border-color: rgba(255,255,255,.2); }

/* Loading skeleton for site cards */
.skeleton-card {
  background: var(--panel);
  border: 1px solid rgba(255,255,255,.06);
  border-radius: var(--radius);
  padding: var(--space-4);
  min-height: 140px;
  position: relative; overflow: hidden;
}
.skeleton-card::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(100deg, transparent 20%, rgba(255,255,255,.03) 50%, transparent 80%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
}
.skeleton-line {
  height: 10px; border-radius: 3px;
  background: rgba(255,255,255,.06); margin-bottom: var(--space-3);
}
.skeleton-line.wide { width: 60%; }
.skeleton-line.short { width: 35%; }

/* Section headings */
.section-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: var(--space-4);
}
.section-title {
  font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
  color: var(--muted);
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  *, ::after { animation: none !important; transition: none !important; }
}

/* Toast notifications */
#toasts {
  position: fixed; bottom: var(--space-5); left: 50%; transform: translateX(-50%);
  display: flex; flex-direction: column; gap: var(--space-3);
  z-index: 30; pointer-events: none;
}
.toast {
  pointer-events: auto;
  padding: var(--space-3) var(--space-5); border-radius: var(--radius);
  background: var(--panel); border: 1px solid rgba(255,255,255,.1);
  color: var(--ink); font-size: 13px; font-weight: 500;
  box-shadow: var(--shadow);
  opacity: 0; transform: translateY(8px);
  transition: opacity .25s ease-out, transform .25s ease-out;
}
.toast.show { opacity: 1; transform: none; }
.toast-err { border-color: rgba(239,68,68,.3); }
</style>
</head>
<body>
<header>
  <div class="brand" role="banner">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-2 8 10-12h-9l2-8z"/></svg>
    </div>
    Voltara
  </div>
  <nav aria-label="Primary">
    <button class="nav-item active" aria-current="page">Dashboard</button>
    <button class="nav-item">Sites</button>
    <button class="nav-item">Meters</button>
    <button class="nav-item">Readings</button>
    <button class="nav-item">Tariffs</button>
    <button class="nav-item">Alerts</button>
  </nav>
</header>
<main class="page" id="app" role="main">
  <!-- KPI band -->
  <section class="kpi-band" role="region" aria-label="Key performance indicators">
    <article class="kpi-tile" aria-label="Total sites" id="kpi-sites" aria-busy="true">
      <div class="kpi-label">Sites</div>
      <div class="kpi-value" data-kpi="total_sites">—</div>
    </article>
    <article class="kpi-tile" aria-label="Active meters" id="kpi-meters" aria-busy="true">
      <div class="kpi-label">Active Meters</div>
      <div class="kpi-value" data-kpi="active_meters">—</div>
    </article>
    <article class="kpi-tile" aria-label="Today's kilowatt hours" id="kpi-kwh" aria-busy="true">
      <div class="kpi-label">Today's kWh</div>
      <div class="kpi-value" data-kpi="today_kwh">—</div>
    </article>
    <article class="kpi-tile" aria-label="Open alerts" id="kpi-alerts" aria-busy="true">
      <div class="kpi-label">Open Alerts</div>
      <div class="kpi-value" data-kpi="open_alerts">—</div>
    </article>
  </section>

  <!-- Site card grid -->
  <section role="region" aria-label="Site status">
    <div class="section-head">
      <h2 class="section-title">Substation Sites</h2>
      <span class="section-title" id="site-count"></span>
    </div>
    <div id="site-grid" class="site-grid" aria-busy="true">
      <div class="skeleton-card"><div class="skeleton-line wide"></div><div class="skeleton-line short"></div><div class="skeleton-line wide" style="margin-top:16px"></div></div>
      <div class="skeleton-card"><div class="skeleton-line wide"></div><div class="skeleton-line short"></div><div class="skeleton-line wide" style="margin-top:16px"></div></div>
      <div class="skeleton-card"><div class="skeleton-line wide"></div><div class="skeleton-line short"></div><div class="skeleton-line wide" style="margin-top:16px"></div></div>
      <div class="skeleton-card"><div class="skeleton-line wide"></div><div class="skeleton-line short"></div><div class="skeleton-line wide" style="margin-top:16px"></div></div>
    </div>
    <div id="site-empty" class="empty" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="2"/><path d="M2 7h20M7 2v20"/></svg>
      <p class="empty-title">No sites configured</p>
      <p class="empty-sub">Add your first substation to begin monitoring.</p>
      <button class="empty-cta" onclick="openNewSite()">+ Add Site</button>
    </div>
  </section>

  <!-- Alert feed -->
  <aside role="complementary" aria-label="Open alerts">
    <div class="alert-feed">
      <h2>Open Alerts</h2>
      <div id="alert-list" aria-busy="true">
        <div class="skeleton-line" style="height:32px"></div>
        <div class="skeleton-line" style="height:32px;margin-top:8px"></div>
        <div class="skeleton-line" style="height:32px;margin-top:8px"></div>
      </div>
      <div id="alert-empty" class="empty" hidden style="padding:var(--space-6) 0">
        <p class="empty-sub">No open alerts. All systems nominal.</p>
      </div>
    </div>
  </aside>
</main>
<div id="toasts" aria-live="polite" aria-atomic="true"></div>

<script src="app.js"></script>
</body>
</html>
