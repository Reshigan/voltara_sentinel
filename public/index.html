<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Voltara Energy Management</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Hanken+Grotesque:wght@400..600&family=JetBrains+Mono:wght@500;600&display=swap');
:root {
  color-scheme: light;
  --paper: #f4f6f8; --surface: #ffffff; --rail: #101a26; --rail-2: #182634;
  --line: #e6e9ef; --line-rail: rgba(255,255,255,.09);
  --ink: #0f1720; --ink-2: #59657a; --ink-3: #8a94a6; --rail-ink: #cdd6e3; --rail-ink-2: #7f8da3;
  --accent: #2f7d6b; --accent-ink: #ffffff; --accent-soft: #e2f1ec;
  --green: #157347; --green-soft: #dcf5e6; --amber: #b45309; --amber-soft: #fdf0d5;
  --coral: #c02748; --coral-soft: #fde3e8; --slate: #475569; --slate-soft: #eef1f5;
  --radius: 16px; --radius-sm: 10px; --nav-w: 15.5rem;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 4px 16px rgba(16,24,40,.06);
  --space-1: 4px; --space-2: 8px; --space-3: 16px; --space-4: 24px; --space-5: 40px;
  --font-display: "Bricolage Grotesque", system-ui, -apple-system, sans-serif;
  --font-body: "Hanken Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
.tabular { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
body { font: 15px/1.55 var(--font-body); background: var(--paper); color: var(--ink);
  display: grid; grid-template-columns: var(--nav-w) 1fr; grid-template-rows: 100vh; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--font-display); letter-spacing: -0.02em; }
aside { background: linear-gradient(180deg, var(--rail) 0%, #0c141d 100%); color: var(--rail-ink);
  padding: var(--space-4) var(--space-3); display: flex; flex-direction: column; gap: var(--space-4); overflow-y: auto; }
.brand { font-family: var(--font-display); font-size: 1.15rem; font-weight: 750; letter-spacing: -0.02em;
  color: #fff; padding: var(--space-1) var(--space-2); display: flex; align-items: center; gap: 8px; }
.brand-mark { width: 22px; height: 22px; border-radius: 7px; background: linear-gradient(135deg, var(--accent), #4fb59c);
  display: inline-block; box-shadow: 0 2px 8px rgba(47,125,107,.5); }
.rail-label { font-size: .68rem; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--rail-ink-2); padding: 0 var(--space-2); }
#nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item { text-align: left; background: none; border: 0; color: var(--rail-ink); font: inherit; font-weight: 500;
  padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm); cursor: pointer; min-height: 40px;
  display: flex; align-items: center; gap: 9px; transition: background .12s, color .12s; }
.nav-item:hover { background: var(--rail-2); color: #fff; }
.nav-item.active { background: var(--rail-2); color: #fff; }
.nav-blip { width: 6px; height: 6px; border-radius: 999px; background: var(--accent);
  box-shadow: 0 0 0 3px rgba(47,125,107,.25); animation: blip 2s ease-out infinite; }
@keyframes blip { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: .55; } }
.rail-foot { margin-top: auto; height: 2px; border-radius: 2px;
  background: repeating-linear-gradient(90deg, var(--accent) 0 18px, transparent 18px 30px); opacity: .6; }
main { overflow-y: auto; padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-4); }
.topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-3); }
#view-title { margin: 0; font-size: 1.7rem; font-weight: 750; }
#view-sub { margin: 4px 0 0; color: var(--ink-2); font-size: .9rem; }
.btn { font: inherit; font-weight: 600; padding: var(--space-2) var(--space-4); min-height: 42px; border-radius: var(--radius-sm);
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; transition: transform .12s, box-shadow .12s, border-color .12s; }
.btn:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); box-shadow: var(--shadow); }
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn-primary:hover { background: color-mix(in srgb, var(--accent) 88%, #000); }
.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
.card.view-enter { animation: view-in .24s cubic-bezier(.22,1,.36,1) both; }
@keyframes view-in { from { opacity: .001; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--space-3); }
.kpi { padding: var(--space-4); display: flex; flex-direction: column; gap: 6px; }
.kpi-label { font-size: .78rem; font-weight: 600; color: var(--ink-2); text-transform: capitalize; }
.kpi-value { font-family: var(--font-display); font-size: 1.9rem; font-weight: 800; line-height: 1; letter-spacing: -0.02em; }
.kpi-sub { font-size: .75rem; color: var(--ink-3); }
.panel { padding: 0; overflow: hidden; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
  padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--line); }
.panel-title { margin: 0; font-size: 1.05rem; font-weight: 700; text-transform: capitalize; }
.count-chip { font-size: .78rem; font-weight: 600; color: var(--ink-2); background: var(--slate-soft);
  padding: 4px 10px; border-radius: 999px; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 13px var(--space-4); border-bottom: 1px solid var(--line); white-space: nowrap; }
th { background: #fafbfc; color: var(--ink-2); font-weight: 600; font-size: .74rem; text-transform: uppercase; letter-spacing: .05em; position: sticky; top: 0; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: #fafbfc; }
td.num, th.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
tr.clickable { cursor: pointer; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: .78rem; font-weight: 600; }
.pill-dot { width: 6px; height: 6px; border-radius: 999px; background: currentColor; opacity: .75; }
.pill-green { background: var(--green-soft); color: var(--green); }
.pill-amber { background: var(--amber-soft); color: var(--amber); }
.pill-coral { background: var(--coral-soft); color: var(--coral); }
.pill-slate { background: var(--slate-soft); color: var(--slate); }
.skeleton-card { min-height: 92px; position: relative; overflow: hidden; }
.skeleton-card.tall { min-height: 16rem; }
.skeleton-card::after { content: ""; position: absolute; inset: 0;
  background: linear-gradient(100deg, transparent 20%, rgba(15,23,32,.04) 50%, transparent 80%);
  background-size: 200% 100%; animation: shimmer 1.3s infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
.empty, .error { text-align: center; padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-2); align-items: center; }
.empty-title, .error-title { font-weight: 700; margin: 0; font-family: var(--font-display); }
.empty-sub, .error-sub { color: var(--ink-2); margin: 0; }
.error-title { color: var(--coral); }
#scrim { position: fixed; inset: 0; background: rgba(15,23,32,.4); opacity: 0; pointer-events: none; transition: opacity .18s; backdrop-filter: blur(2px); }
#scrim.open { opacity: 1; pointer-events: auto; }
#drawer { position: fixed; top: 0; right: 0; height: 100%; width: min(27rem, 92vw); background: var(--surface);
  box-shadow: -12px 0 40px rgba(15,23,32,.14); transform: translateX(100%); transition: transform .24s cubic-bezier(.22,1,.36,1); display: flex; flex-direction: column; }
#drawer.open { transform: none; }
.drawer-head { display: flex; align-items: center; justify-content: space-between; padding: var(--space-4);
  border-bottom: 1px solid var(--line); }
.drawer-head h2 { margin: 0; font-size: 1.15rem; font-weight: 700; }
#drawer-close { background: none; border: 0; color: var(--ink-3); font-size: 1.5rem; cursor: pointer; line-height: 1; padding: 4px 8px; border-radius: 8px; }
#drawer-close:hover { background: var(--slate-soft); color: var(--ink); }
#drawer-body { padding: var(--space-4); overflow-y: auto; }
.detail { display: grid; grid-template-columns: auto 1fr; gap: 12px var(--space-4); margin: 0; align-items: center; }
.detail dt { color: var(--ink-2); font-size: .82rem; font-weight: 500; }
.detail dd { margin: 0; font-weight: 500; }
.detail dd.num, .detail .tabular { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.form { display: flex; flex-direction: column; gap: var(--space-3); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: .82rem; color: var(--ink-2); font-weight: 500; }
input { font: inherit; padding: var(--space-2) var(--space-3); min-height: 44px; border-radius: var(--radius-sm);
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
input:focus { border-color: var(--accent); }
.nav-item:focus-visible, .btn:focus-visible, tr.clickable:focus-visible, input:focus-visible, #drawer-close:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px; }
#toasts { position: fixed; bottom: var(--space-4); left: 50%; transform: translateX(-50%); display: flex;
  flex-direction: column; gap: var(--space-2); z-index: 10; }
.toast { padding: 10px var(--space-4); border-radius: 999px; background: var(--ink); color: #fff; font-weight: 500;
  box-shadow: 0 8px 24px rgba(15,23,32,.25); transition: opacity .3s, transform .3s; }
.toast-err { background: var(--coral); }
.toast.out { opacity: 0; transform: translateY(8px); }
@media (prefers-reduced-motion: reduce) { *, ::after { animation: none !important; transition: none !important; } }
@media (max-width: 760px) {
  body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  aside { flex-direction: row; align-items: center; gap: var(--space-3); overflow-x: auto; padding: var(--space-2) var(--space-3); }
  .rail-label, .rail-foot { display: none; }
  #nav { flex-direction: row; }
  .nav-item { white-space: nowrap; }
  main { padding: var(--space-3); }
  #view-title { font-size: 1.4rem; }
}
</style>
</head>
<body>
  <aside>
    <div class="brand"><span class="brand-mark"></span>Voltara Energy Management</div>
    <div class="rail-label">Workspace</div>
    <nav id="nav" aria-label="Entities"></nav>
    <div class="rail-foot" aria-hidden="true"></div>
  </aside>
  <main>
    <div class="topbar">
      <div>
        <h1 id="view-title">Loading…</h1>
        <p id="view-sub"></p>
      </div>
      <button id="new-btn" class="btn btn-primary" hidden>+ New</button>
    </div>
    <div id="content"></div>
  </main>
  <div id="scrim"></div>
  <div id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <div class="drawer-head"><h2 id="drawer-title"></h2><button id="drawer-close" aria-label="Close">×</button></div>
    <div id="drawer-body"></div>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <script>
    const SCHEMA = {"app":"Voltara Energy Management","views":[{"name":"site","title":"Site","fields":[{"name":"name","type":"text","label":"Name"},{"name":"region","type":"text","label":"Region"},{"name":"capacity_kw","type":"real","label":"Capacity kw"},{"name":"created_at","type":"text","label":"Created at"},{"name":"updated_at","type":"text","label":"Updated at"}],"list":"/api/sites","create":"/api/sites","get":"/api/sites/:id"},{"name":"meter","title":"Meter","fields":[{"name":"serial","type":"text","label":"Serial"},{"name":"site_id","type":"integer","label":"Site id"},{"name":"kind","type":"text","label":"Kind"},{"name":"status","type":"text","label":"Status"},{"name":"tariff_id","type":"integer","label":"Tariff id"},{"name":"created_at","type":"text","label":"Created at"},{"name":"updated_at","type":"text","label":"Updated at"}],"list":"/api/meters","create":"/api/meters","get":"/api/meters/:id"},{"name":"reading","title":"Reading","fields":[{"name":"meter_id","type":"integer","label":"Meter id"},{"name":"kwh","type":"real","label":"Kwh"},{"name":"demand_kw","type":"real","label":"Demand kw"},{"name":"taken_at","type":"text","label":"Taken at"},{"name":"created_at","type":"text","label":"Created at"}],"list":"/api/readings","create":"/api/readings","get":"/api/readings/:id"},{"name":"tariff","title":"Tariff","fields":[{"name":"name","type":"text","label":"Name"},{"name":"rate_per_kwh","type":"real","label":"Rate per kwh"},{"name":"band","type":"text","label":"Band"},{"name":"created_at","type":"text","label":"Created at"},{"name":"updated_at","type":"text","label":"Updated at"}],"list":"/api/tariffs","create":"/api/tariffs","get":"/api/tariffs/:id"},{"name":"alert","title":"Alert","fields":[{"name":"meter_id","type":"integer","label":"Meter id"},{"name":"severity","type":"text","label":"Severity"},{"name":"message","type":"text","label":"Message"},{"name":"opened_at","type":"text","label":"Opened at"},{"name":"status","type":"text","label":"Status"},{"name":"acknowledged_at","type":"text","label":"Acknowledged at"},{"name":"closed_at","type":"text","label":"Closed at"}],"list":"/api/alerts","create":"/api/alerts","get":"/api/alerts/:id"}]};
  </script>
  <script>
const $ = (s, r = document) => r.querySelector(s);
const fmt = (v) => v === null || v === undefined ? "\u2014" : typeof v === "number" ? v.toLocaleString() : String(v);
const el = (tag, props = {}, kids = []) => {
  const n = Object.assign(document.createElement(tag), props);
  for (const k of [].concat(kids)) n.append(k);
  return n;
};
// Multi-tenant: the whole UI operates within one tenant, resolved from ?tenant=
// (default "default"), and every request carries it so reads/writes stay scoped.
const TENANT = new URLSearchParams(location.search).get("tenant") || "default";
async function api(path, opts) {
  const url = path + (path.includes("?") ? "&" : "?") + "tenant=" + encodeURIComponent(TENANT);
  const r = await fetch(url, opts);
  const body = r.headers.get("content-type")?.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error(typeof body === "object" && body?.error ? body.error : (r.statusText || "request failed"));
  return body;
}
function toast(msg, kind = "ok") {
  const t = el("div", { className: "toast toast-" + kind, textContent: msg });
  $("#toasts").append(t);
  setTimeout(() => t.classList.add("out"), 2400);
  setTimeout(() => t.remove(), 2800);
}
function rowsOf(data) {
  if (Array.isArray(data)) return data;
  if (data && Array.isArray(data.items)) return data.items;
  if (data && Array.isArray(data.rows)) return data.rows;
  return data && typeof data === "object" ? [data] : [];
}

// A field carrying a small categorical state (status/state/kind/type/tier/\u2026) renders
// as a semantic pill instead of raw text \u2014 the single biggest lift in scanability.
const STATUS_RE = /(^|_)(status|state|kind|type|tier|level|role|severity|priority|stage|phase)$/i;
const isStatusField = (f) => f.type === "text" && STATUS_RE.test(f.name);
function toneOf(value) {
  const s = String(value).toLowerCase();
  if (/(active|ok|success|done|complete|completed|paid|approved|live|passed|pass|reconciled|settled|enabled|online|healthy|resolved)/.test(s)) return "green";
  if (/(pending|processing|queued|in.?progress|review|awaiting|draft|open|scheduled|new|warn|warning)/.test(s)) return "amber";
  if (/(error|failed|fail|rejected|overdue|blocked|cancelled|canceled|exception|inactive|offline|expired|critical|high|down)/.test(s)) return "coral";
  return "slate";
}
const pill = (value) => el("span", { className: "pill pill-" + toneOf(value) }, [
  el("span", { className: "pill-dot" }), document.createTextNode(fmt(value)),
]);

let current = null;

function renderNav() {
  const nav = $("#nav");
  nav.replaceChildren();
  for (const v of SCHEMA.views) {
    const active = v === current;
    const b = el("button", { className: "nav-item" + (active ? " active" : ""), type: "button" }, [
      el("span", { className: "nav-blip", hidden: !active }),
      document.createTextNode(v.title),
    ]);
    b.setAttribute("aria-current", active ? "page" : "false");
    b.onclick = () => selectView(v);
    nav.append(b);
  }
}

function selectView(v) {
  current = v;
  renderNav();
  $("#view-title").textContent = v.title;
  $("#view-sub").textContent = "Loading\u2026";
  const c = $("#content");
  c.replaceChildren(
    el("div", { className: "kpis" }, [0, 1, 2].map(() => el("div", { className: "card kpi skeleton-card" }))),
    el("div", { className: "card skeleton-card tall" }),
  );
  $("#new-btn").hidden = !v.create;
  loadTable(v);
}

// KPI band derived honestly from the rows on screen: the live count, plus the total
// of each numeric field (up to three, so the band never wraps or invents metrics).
function renderKpis(v, rows) {
  const cards = [kpiCard(v.title, rows.length.toLocaleString(), "Live count")];
  const nums = v.fields.filter((f) => f.type === "integer" || f.type === "real").slice(0, 3);
  for (const f of nums) {
    const sum = rows.reduce((a, row) => a + (typeof row[f.name] === "number" ? row[f.name] : 0), 0);
    // data-kpi=<field> makes the figure machine-readable \u2014 seeded live-acceptance
    // seeds a known total and asserts this displayed number matches.
    cards.push(kpiCard("Total " + f.label.toLowerCase(), sum.toLocaleString(undefined, { maximumFractionDigits: 2 }), "Sum across " + rows.length + " rows", f.name));
  }
  return el("div", { className: "kpis" }, cards);
}
const kpiCard = (label, value, sub, key) => {
  const valueEl = el("div", { className: "kpi-value tabular", textContent: value });
  if (key) valueEl.setAttribute("data-kpi", key);
  return el("div", { className: "card kpi" }, [
    el("div", { className: "kpi-label", textContent: label }),
    valueEl,
    el("div", { className: "kpi-sub", textContent: sub }),
  ]);
};

async function loadTable(v) {
  const c = $("#content");
  try {
    const rows = rowsOf(await api(v.list));
    $("#view-sub").textContent = rows.length + " " + (rows.length === 1 ? "record" : "records");
    if (!rows.length) {
      c.replaceChildren(el("div", { className: "card empty" }, [
        el("p", { className: "empty-title", textContent: "No " + v.title.toLowerCase() + " yet" }),
        el("p", { className: "empty-sub", textContent: v.create ? "Add the first one to get started." : "Nothing to show." }),
      ]));
      return;
    }
    const cols = ["id", ...v.fields.map((f) => f.name)];
    const head = el("tr", {}, cols.map((k) => el("th", { textContent: k === "id" ? "ID" : (v.fields.find((f) => f.name === k)?.label ?? k) })));
    const body = rows.map((row) => {
      const tr = el("tr", {}, cols.map((k) => {
        const f = v.fields.find((f) => f.name === k);
        if (f && isStatusField(f) && row[k] != null) return el("td", {}, pill(row[k]));
        const td = el("td", { textContent: fmt(row[k]) });
        if (f && (f.type === "integer" || f.type === "real")) td.className = "num";
        return td;
      }));
      if (v.get) { tr.className = "clickable"; tr.onclick = () => openDetail(v, row); tr.tabIndex = 0;
        tr.onkeydown = (e) => { if (e.key === "Enter") openDetail(v, row); }; }
      return tr;
    });
    const table = el("table", {}, [el("thead", {}, head), el("tbody", {}, body)]);
    const panel = el("section", { className: "card panel view-enter" }, [
      el("div", { className: "panel-head" }, [
        el("h2", { className: "panel-title", textContent: "All " + v.title.toLowerCase() }),
        el("span", { className: "count-chip", textContent: rows.length + " " + (rows.length === 1 ? "row" : "rows") }),
      ]),
      el("div", { className: "table-wrap" }, table),
    ]);
    c.replaceChildren(renderKpis(v, rows), panel);
  } catch (e) {
    c.replaceChildren(el("div", { className: "card error" }, [
      el("p", { className: "error-title", textContent: "Couldn't load " + v.title.toLowerCase() }),
      el("p", { className: "error-sub", textContent: String(e.message || e) }),
      el("button", { className: "btn", textContent: "Retry", onclick: () => selectView(v) }),
    ]));
  }
}

function openDetail(v, row) {
  const dl = el("dl", { className: "detail" });
  for (const k of ["id", ...v.fields.map((f) => f.name)]) {
    const f = v.fields.find((f) => f.name === k);
    const label = k === "id" ? "ID" : (f?.label ?? k);
    const numeric = f && (f.type === "integer" || f.type === "real");
    const dd = f && isStatusField(f) && row[k] != null
      ? el("dd", {}, pill(row[k]))
      : el("dd", { textContent: fmt(row[k]), className: numeric || k === "id" ? "num" : "" });
    dl.append(el("dt", { textContent: label }), dd);
  }
  openDrawer(v.title.replace(/s$/, "") + " \u00B7 #" + fmt(row.id), dl);
}

function openForm(v) {
  const form = el("form", { className: "form" });
  for (const f of v.fields) {
    const id = "f-" + f.name;
    const input = el("input", {
      id, name: f.name, required: true,
      type: f.type === "text" ? "text" : "number",
      step: f.type === "real" ? "any" : "1",
      inputMode: f.type === "text" ? "text" : "numeric",
    });
    form.append(el("div", { className: "field" }, [
      el("label", { htmlFor: id, textContent: f.label }), input,
    ]));
  }
  const submit = el("button", { className: "btn btn-primary", type: "submit", textContent: "Create " + v.title.replace(/s$/, "") });
  form.append(submit);
  form.onsubmit = async (e) => {
    e.preventDefault();
    submit.disabled = true; submit.textContent = "Saving\u2026";
    const payload = {};
    for (const f of v.fields) {
      const raw = form.elements[f.name].value;
      payload[f.name] = f.type === "text" ? raw : Number(raw);
    }
    try {
      await api(v.create, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(payload) });
      toast(v.title.replace(/s$/, "") + " created");
      closeDrawer();
      loadTable(v);
    } catch (err) {
      toast(String(err.message || err), "err");
      submit.disabled = false; submit.textContent = "Create " + v.title.replace(/s$/, "");
    }
  };
  openDrawer("New " + v.title.replace(/s$/, ""), form);
}

function openDrawer(title, node) {
  $("#drawer-title").textContent = title;
  $("#drawer-body").replaceChildren(node);
  $("#drawer").classList.add("open");
  $("#scrim").classList.add("open");
}
function closeDrawer() {
  $("#drawer").classList.remove("open");
  $("#scrim").classList.remove("open");
}

$("#new-btn").onclick = () => current?.create && openForm(current);
$("#scrim").onclick = closeDrawer;
$("#drawer-close").onclick = closeDrawer;
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });

renderNav();
if (SCHEMA.views.length) selectView(SCHEMA.views[0]);
else $("#content").replaceChildren(el("div", { className: "empty" }, el("p", { className: "empty-title", textContent: "No views defined." })));
</script>
</body>
</html>
